name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to the same branch or pull request makes the run in progress pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # Switch to @ci-v1 once mishka-group/mishka_cms#77 is merged and tagged.
    uses: mishka-group/mishka_cms/.github/workflows/mishka-ci.yml@ci/shared-workflows
    with:
      # Today CI compiles, runs `mix deps.audit` and `mix test --trace`; Credo, Dialyzer and ExDNA are not run.
      elixir: 1.20.5-otp-29
      otp: 29.1.2
      credo: false
      dialyzer: false
      ex_dna: false
      test-args: --trace
