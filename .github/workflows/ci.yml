name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to the same branch or pull request makes the run in progress pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: mishka-group/mishka_cms/.github/workflows/mishka-ci.yml@ci-v1
    with:
      # The same checks as `mix ci`: Credo (with ExSlop and Jump's checks), Credence, Sobelow,
      # Dialyzer, ExDNA with no copied code, the Spark cheat sheets, then the tests.
      elixir: 1.20.5-otp-29
      otp: 29.1.2
      credence-task: guarded_struct.credence
      sobelow: true
      ex-dna-args: --max-clones 0
      spark-cheat-sheets: true
      test-args: --trace
