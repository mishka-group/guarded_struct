name: GuardedStruct CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# No job writes to the repository, so the token can only read it.
permissions:
  contents: read

jobs:
  ci:
    env:
      GITHUB_ACTION: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - pair:
              elixir: "1.20.4"
              otp: "29.1.2"

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: ${{matrix.pair.otp}}
          elixir-version: ${{matrix.pair.elixir}}

      - name: Elixir and Erlang Dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Source Compiling
        run: |
          mix deps.get
          mix deps.compile

      # mix_audit; Hex's own audit is hex-audit.yml.
      - name: Audit dependencies
        run: mix deps.audit

      - name: Run test with temporary information
        run: |
          mix test --trace
